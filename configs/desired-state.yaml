# Desired-state baseline applied uniformly to every top-level group/project
# resolved in a pipeline run. Edit and review like code -- this file *is*
# the policy.

mr_policy:
  # Security policy project linked to each top-level group's "merge request
  # approval policy" (GitLab Security & Compliance > Policies), not the
  # boolean group MR-approval settings.
  security_policy_project_path: "dso-security-policy/mr-policy-1-approver-security-policy-project"

compliance_framework:
  # Created (if missing) or reconciled (if drifted) at each top-level group,
  # then assigned to every project in that group.
  name: "security-compliant"
  color: "#9400d3"
  description: "security compliance framework"
  pipeline_configuration_full_path: "compliance-framework-appsec.gitlab-ci.yml@compliance-framework/compliance-framework-appsec"

# Group-level protected environments are keyed by deployment tier. Each is
# protected the same way: deploy and approval restricted to Maintainer.
protected_environments:
  - environment_name: production
    deploy_access_level: maintainer
    approver_access_level: maintainer
    required_approval_count: 1
  - environment_name: staging
    deploy_access_level: maintainer
    approver_access_level: maintainer
    required_approval_count: 1
  # Developers and Maintainers may deploy; the TechLib Approvers group approves.
  # That group is shared into each top-level group first (as Reporter) if it
  # isn't already, because a group approval rule needs the group to have access.
  - environment_name: other
    deploy_access_level: developer
    required_approval_count: 1
    approver_group_id: 23328
    approver_group_access_level: reporter

group_default_branch:
  branch_name: master

default_branch_rename:
  branch_name: master
  # Applied when the branch is created/switched to default: no one but
  # Maintainers can push or merge (no direct push for Developers, no
  # force-push for anyone).
  protect_push_access_level: maintainer
  protect_merge_access_level: maintainer

# Every migrated project gets a badge reading "AZDO Migrated <date>". The badge
# picture is an SVG per date (made with `badge-image`) kept in a repository all
# users can read. Set image_project before running project-migration-badge.
project_migration_badge:
  name: "AZDO Migrated"
  image_project: ""   # e.g. "<group>/gitlab-post-migration" (internal visibility)
  image_ref: master
  image_dir: assets

