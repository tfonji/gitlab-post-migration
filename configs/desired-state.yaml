# Desired-state baseline applied to every top-level group/project in a run; edit it like code.

mr_policy:
  # Security policy project (merge request approval policy) linked to each top-level group.
  security_policy_project_path: "dso-security-policy/mr-policy-1-approver-security-policy-project"

compliance_framework:
  # Created or reconciled at each top-level group, then assigned to its projects.
  name: "security-compliant"
  color: "#9400d3"
  description: "security compliance framework"
  pipeline_configuration_full_path: "compliance-framework-appsec.gitlab-ci.yml@compliance-framework/compliance-framework-appsec"

# Group-level protected environments are keyed by deployment tier.
protected_environments:
  - environment_name: production
    deploy_access_level: maintainer
    approver_access_level: maintainer
    required_approval_count: 1
  - environment_name: staging
    deploy_access_level: maintainer
    approver_access_level: maintainer
    required_approval_count: 1
  # Developers and Maintainers deploy; the TechLib Approvers group approves, shared in as Reporter first if needed.
  - environment_name: other
    deploy_access_level: developer
    required_approval_count: 1
    approver_group_id: 23328
    approver_group_access_level: reporter

group_default_branch:
  branch_name: master

default_branch_rename:
  branch_name: master
  # Protection for the new default branch: only Maintainers push or merge, no force-push.
  protect_push_access_level: maintainer
  protect_merge_access_level: maintainer

# Every migrated project gets an "AZDO Migrated <date>" badge; its SVG goes to this repo unless image_project/image_ref say otherwise.
project_migration_badge:
  name: "AZDO Migrated"
  image_dir: assets
